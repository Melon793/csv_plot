[project]
name = "csv-plot"
version = "0.2.0"
description = "A fast CSV data visualization tool with support for large files, interactive plotting, and statistical analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asammdf>=7.4.0",
    "charset-normalizer>=3.0.0",
    "numpy>=2.0.2",
    "openpyxl>=3.1.0",
    "pandas>=2.3.2",
    "python-calamine>=0.3.0",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "pyyaml>=6.0.0",
    "ujson>=5.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "nuitka>=2.0",
    "pyinstaller>=6.0",
    "pytest-qt>=4.5.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
markers = [
    "unit: 纯逻辑单元测试（无 Qt 界面依赖，秒级完成）",
    "component: offscreen 控件级功能测试",
    "e2e: 主窗口端到端冒烟测试",
    "perf: 性能回归测试",
]
