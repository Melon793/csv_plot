[project]
name = "csv-plot"
version = "0.1.0"
description = "A fast CSV data visualization tool with support for large files, interactive plotting, and statistical analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asammdf>=7.4.0",
    "charset-normalizer>=3.0.0",
    "numpy>=2.0.2",
    "pandas>=2.3.2",
    "pathlib>=1.0.1",
    "pyqt6>=6.9.1,<6.11",
    "pyqtgraph>=0.14.0",
    "ujson>=5.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
link-mode = "copy"