[project]
name = "csv-plot"
version = "0.4.3"
description = "A fast CSV data visualization tool with support for large files, interactive plotting, and statistical analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asammdf>=7.4.0",
    "charset-normalizer>=3.0.0",
    "numpy>=2.0.2",
    "openpyxl>=3.1.0",
    "pandas>=2.3.2",
    "python-calamine>=0.3.0",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "pyyaml>=6.0.0",
    "shiboken6>=6.11.1",
    "ujson>=5.11.0",
    "polars>=1.44.2,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "nuitka>=2.0",
    "pyinstaller>=6.0",
    "pytest-qt>=4.5.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
# --timeout：把历史上的"永久挂起"（WaitSignal 死锁、模态弹窗）变成可诊断失败
# --durations=20：常态暴露慢用例，防止本次优化被后续提交吃回
#   （另见 tests/conftest.py 里的 >1s 点名护栏）
# -m "not perf"：perf 层用大夹具、按需手动跑（uv run pytest -m perf），
#   不进默认集（§6.4 耗时护栏；tests/README.md 运行策略表同口径）
addopts = "-ra --timeout=120 --timeout-method=thread --durations=20 -m \"not perf\""
markers = [
    "unit: 纯逻辑单元测试（无 Qt 界面依赖，秒级完成）",
    "component: offscreen 控件级功能测试",
    "e2e: 主窗口端到端冒烟测试",
    "perf: 性能回归测试",
    "full_matrix: e2e 用例要求真实默认子图矩阵（跳过 1×1 加速替身）",
]
