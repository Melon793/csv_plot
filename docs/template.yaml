# 模板创建时间
created_at: "2026-05-22T10:30:00"

# 绘图区域布局行数/列数
layout_rows: 2
layout_cols: 2

# 时间轴缩放因子、偏移量（用于调整时间轴显示比例）
time_factor: 1.0
time_offset: 0.0

# 各子图配置列表（按从左到右、从上到下的顺序）
plots:
  - # 子图的曲线变量名列表
    curves:
      - rpm
      - speed

# 如果需要添加更多子图，请复制下方模板并取消注释：
#  - # 子图的曲线变量名列表
#    curves:
#      - 变量名1
#      - 变量名2
